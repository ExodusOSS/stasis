[package]
name = "lib-a"
version = "0.2.0"
edition = "2021"

[dependencies]
winnowish = "0.5"
serde = { version = "1", optional = true }
extra-dep = { version = "1", optional = true }

[features]
default = ["std"]
std = ["extra-dep"]   # the optional dep's implicit feature, spelled as in the manifest
extra = []
serde = ["dep:serde"]
